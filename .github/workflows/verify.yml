name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check Code
    uses: ./.github/workflows/run-task.yml
    with:
      node-version: 24
      task: check

  coverage:
    name: Check Coverage
    needs: test
    uses: ./.github/workflows/run-task.yml
    with:
      node-version: 24
      task: test:coverage

  test:
    name: Test / v${{ matrix.node-version }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Clone Ruscus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-node
        name: Install Node.js ${{ matrix.node-version }}
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm run test
